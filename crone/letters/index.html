<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Write a Letter | Crone</title><style>*{box-sizing:border-box}body{margin:0;background:#151013;color:#eee2d0;font:17px Georgia,serif}main{max-width:760px;margin:auto;padding:24px 18px}a{color:#c7a267}h1{font-weight:normal;font-size:40px}label{display:block;margin:19px 0 6px;color:#d7bd92}input,textarea,select,button{width:100%;font:inherit;background:#231a21;color:#f0e4d2;border:1px solid #735839;padding:12px}textarea{min-height:155px;resize:vertical}button{cursor:pointer;margin-top:15px;background:#7c5a31}button.secondary{background:transparent}.observation{border:1px solid #59412e;padding:14px;margin-top:12px}.observation textarea{min-height:100px}.row{display:flex;justify-content:space-between;gap:12px}p{color:#bba990}.status{min-height:25px;color:#d4bd91}</style></head><body><main><nav class="row"><a href="/crone/">← Crone</a><a href="/grimoire/letters/">Book of Letters →</a></nav><h1 id="heading">Write a Letter</h1><p>Keep the question as it was first written. Add dated reflections whenever something feels meaningful.</p><form id="form"><label for="title">Letter title</label><input id="title" maxlength="160" placeholder="A question for Grandma"><label for="recipient">Addressed to</label><input id="recipient" maxlength="160" placeholder="Guide, relative, ancestor…"><label for="date">Date asked</label><input id="date" type="date" required><label for="asked">My question</label><textarea id="asked" required placeholder="What did I ask?"></textarea><label for="status">Letter status</label><select id="status"><option value="open">Awaiting reply</option><option value="answered">Answered</option></select><h2>Possible replies & reflections</h2><div id="observations"></div><button class="secondary" id="add" type="button">+ Add dated observation</button><p class="status" id="message" role="status"></p><button id="save" type="submit">Save private letter</button></form></main><script>const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');$('date').value=new Date().toLocaleDateString('en-CA');function addObservation(data={}){const box=document.createElement('div');box.className='observation';const l=document.createElement('label');l.textContent='Date noticed';const date=document.createElement('input');date.type='date';date.value=data.date||new Date().toLocaleDateString('en-CA');const n=document.createElement('label');n.textContent='What happened? What did it mean to me?';const note=document.createElement('textarea');note.value=data.note||'';const remove=document.createElement('button');remove.type='button';remove.className='secondary';remove.textContent='Remove observation';remove.onclick=()=>box.remove();box.append(l,date,n,note,remove);$('observations').append(box)}$('add').onclick=()=>addObservation();if(id)fetch('/api/crone/letters?id='+encodeURIComponent(id)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);for(const k of ['title','recipient','date','asked','status'])$(k).value=d[k]||'';(d.observations||[]).forEach(addObservation);$('heading').textContent='Edit a Letter'}).catch(e=>$('message').textContent=e.message);$('form').onsubmit=async e=>{e.preventDefault();const button=$('save');button.disabled=true;$('message').textContent='Saving privately…';try{const observations=[...document.querySelectorAll('.observation')].map(b=>({date:b.querySelector('input').value,note:b.querySelector('textarea').value.trim()})).filter(x=>x.note);const fields=Object.fromEntries(['title','recipient','date','asked','status'].map(k=>[k,$(k).value.trim()]));const r=await fetch('/api/crone/letters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...fields,observations,...(id?{id}:{})})});const d=await r.json();if(!r.ok)throw Error(d.error);$('message').textContent='Letter saved in private storage.';if(!id)history.replaceState(null,'','?id='+encodeURIComponent(d.id))}catch(err){$('message').textContent=err.message}finally{button.disabled=false}};</script></body></html>
