media:
  input: images/uploads
  output: /images/uploads
  rename: safe
  categories: [image]

content:
  - name: journal
    label: Journal
    type: collection
    path: journal/entries
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter

    view:
      primary: title
      sort: date
      order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: category
        label: Category
        type: select
        options:
          values:
            - Journal
            - Garden
            - 301 Ruby
            - History
            - Family

      - name: image
        label: Image
        type: image
        required: false

      - name: body
        label: Entry
        type: rich-text
        required: true

  - name: grimoire
    label: Dreams
    type: collection
    path: grimoire/dreams/entries
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter

    view:
      primary: title
      sort: date
      order: desc

    fields:       
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: image
        label: Image
        type: image
        required: false

      - name: body
        label: Entry
        type: rich-text
        required: true

  - name: spells
    label: Spells
    type: collection
    path: grimoire/spells/entries
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter

    view:
      primary: title
      sort: date
      order: desc

    fields:        
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: purpose
        label: Purpose
        type: string
        required: false

      - name: ingredients
        label: Ingredients
        type: rich-text
        required: false

      - name: method
        label: Method
        type: rich-text
        required: false

      - name: notes
        label: Notes
        type: rich-text
        required: false

      - name: outcome
        label: Outcome
        type: rich-text
        required: false

      - name: image
        label: Image
        type: image
        required: false

      - name: body
        label: Entry
        type: rich-text
        required: false

  - name: recipes
    label: Recipes
    type: collection
    path: grimoire/recipes/entries
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter

    view:
      primary: title
      fields:
        - category
        - date
      sort: date
      order: desc

    fields:
      - name: title
        label: Recipe Name
        type: string
        required: true

      - name: date
        label: Date Made
        type: date
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - value: apothecary
              label: Apothecary
            - value: tea-herbal
              label: Tea & Herbal
            - value: kitchen
              label: Kitchen
            - value: ritual
              label: Ritual
            - value: home
              label: Home
            - value: bath-body
              label: Bath & Body

      - name: purpose
        label: Purpose
        type: string
        required: false

      - name: ingredients
        label: Ingredients
        type: rich-text
        required: true

      - name: method
        label: Method
        type: rich-text
        required: true

      - name: storage
        label: Storage
        type: string
        required: false

      - name: shelf_life
        label: Shelf Life
        type: string
        required: false

      - name: result
        label: Result
        type: rich-text
        required: false

      - name: changes
        label: Changes for Next Time
        type: rich-text
        required: false

      - name: notes
        label: Notes
        type: rich-text
        required: false

      - name: body
        label: Additional Entry
        type: rich-text
        required: false
