media:
  input: images/uploads
  output: /images/uploads
  rename: safe
  categories: [image]

content:
  - name: grimoire_section
    label: Grimoire
    type: group
    items:
      - name: journal
        label: Journal
        type: collection
        path: journal/entries
        filename: "{year}-{month}-{day}.md"
        format: yaml-frontmatter
        view:
          primary: date
          sort: date
          order: desc
        fields:
          - { name: date, label: Date, type: date, required: true }
          - { name: body, label: Entry, type: rich-text, required: true }

      - name: grimoire
        label: Dreams
        type: collection
        path: grimoire/dreams/entries
        filename: "{year}-{month}-{day}-{primary}.md"
        format: yaml-frontmatter
        view:
          primary: title
          sort: date
          order: desc
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: date, label: Date, type: date, required: true }
          - { name: image, label: Image, type: image, required: false }
          - { name: body, label: Entry, type: rich-text, required: true }

      - name: spells
        label: Spells
        type: collection
        path: grimoire/spells/entries
        filename: "{year}-{month}-{day}-{primary}.md"
        format: yaml-frontmatter
        view:
          primary: title
          sort: date
          order: desc
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: date, label: Date, type: date, required: true }
          - { name: purpose, label: Purpose, type: string, required: false }
          - { name: ingredients, label: Ingredients, type: rich-text, required: false }
          - { name: method, label: Method, type: rich-text, required: false }
          - { name: notes, label: Notes, type: rich-text, required: false }
          - { name: outcome, label: Outcome, type: rich-text, required: false }
          - { name: image, label: Image, type: image, required: false }
          - { name: body, label: Entry, type: rich-text, required: false }

      - name: recipes
        label: Recipes
        type: collection
        path: grimoire/recipes/entries
        filename: "{year}-{month}-{day}-{primary}.md"
        format: yaml-frontmatter
        view:
          primary: title
          fields: [category, date]
          sort: date
          order: desc
        fields:
          - { name: title, label: Recipe Name, type: string, required: true }
          - { name: date, label: Date Made, type: date, required: true }
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - { value: apothecary, label: Apothecary }
                - { value: tea-herbal, label: Tea & Herbal }
                - { value: kitchen, label: Kitchen }
                - { value: ritual, label: Ritual }
                - { value: home, label: Home }
                - { value: bath-body, label: Bath & Body }
          - { name: purpose, label: Purpose, type: string, required: false }
          - { name: ingredients, label: Ingredients, type: rich-text, required: true }
          - { name: method, label: Method, type: rich-text, required: true }
          - { name: storage, label: Storage, type: string, required: false }
          - { name: shelf_life, label: Shelf Life, type: string, required: false }
          - { name: result, label: Result, type: rich-text, required: false }
          - { name: changes, label: Changes for Next Time, type: rich-text, required: false }
          - { name: notes, label: Notes, type: rich-text, required: false }
          - { name: body, label: Additional Entry, type: rich-text, required: false }

      - name: tarot
        label: Tarot
        type: collection
        path: grimoire/tarot/entries
        filename: "{year}-{month}-{day}-{primary}.md"
        format: yaml-frontmatter
        view:
          primary: title
          fields: [deck, orientation, date]
          sort: date
          order: desc
        fields:
          - { name: title, label: Card or Reading Title, type: string, required: true }
          - { name: date, label: Date, type: date, required: true }
          - { name: deck, label: Deck, type: string, required: false }
          - name: card
            label: Tarot Card
            type: select
            required: true
            options:
              values:
                - { value: the-fool, label: The Fool }
                - { value: the-magician, label: The Magician }
                - { value: the-high-priestess, label: The High Priestess }
                - { value: the-empress, label: The Empress }
                - { value: the-emperor, label: The Emperor }
                - { value: the-hierophant, label: The Hierophant }
                - { value: the-lovers, label: The Lovers }
                - { value: the-chariot, label: The Chariot }
                - { value: strength, label: Strength }
                - { value: the-hermit, label: The Hermit }
                - { value: wheel-of-fortune, label: Wheel of Fortune }
                - { value: justice, label: Justice }
                - { value: the-hanged-man, label: The Hanged Man }
                - { value: death, label: Death }
                - { value: temperance, label: Temperance }
                - { value: the-devil, label: The Devil }
                - { value: the-tower, label: The Tower }
                - { value: the-star, label: The Star }
                - { value: the-moon, label: The Moon }
                - { value: the-sun, label: The Sun }
                - { value: judgement, label: Judgement }
                - { value: the-world, label: The World }
                - { value: ace-of-wands, label: Ace of Wands }
                - { value: two-of-wands, label: Two of Wands }
                - { value: three-of-wands, label: Three of Wands }
                - { value: four-of-wands, label: Four of Wands }
                - { value: five-of-wands, label: Five of Wands }
                - { value: six-of-wands, label: Six of Wands }
                - { value: seven-of-wands, label: Seven of Wands }
                - { value: eight-of-wands, label: Eight of Wands }
                - { value: nine-of-wands, label: Nine of Wands }
                - { value: ten-of-wands, label: Ten of Wands }
                - { value: page-of-wands, label: Page of Wands }
                - { value: knight-of-wands, label: Knight of Wands }
                - { value: queen-of-wands, label: Queen of Wands }
                - { value: king-of-wands, label: King of Wands }
                - { value: ace-of-cups, label: Ace of Cups }
                - { value: two-of-cups, label: Two of Cups }
                - { value: three-of-cups, label: Three of Cups }
                - { value: four-of-cups, label: Four of Cups }
                - { value: five-of-cups, label: Five of Cups }
                - { value: six-of-cups, label: Six of Cups }
                - { value: seven-of-cups, label: Seven of Cups }
                - { value: eight-of-cups, label: Eight of Cups }
                - { value: nine-of-cups, label: Nine of Cups }
                - { value: ten-of-cups, label: Ten of Cups }
                - { value: page-of-cups, label: Page of Cups }
                - { value: knight-of-cups, label: Knight of Cups }
                - { value: queen-of-cups, label: Queen of Cups }
                - { value: king-of-cups, label: King of Cups }
                - { value: ace-of-swords, label: Ace of Swords }
                - { value: two-of-swords, label: Two of Swords }
                - { value: three-of-swords, label: Three of Swords }
                - { value: four-of-swords, label: Four of Swords }
                - { value: five-of-swords, label: Five of Swords }
                - { value: six-of-swords, label: Six of Swords }
                - { value: seven-of-swords, label: Seven of Swords }
                - { value: eight-of-swords, label: Eight of Swords }
                - { value: nine-of-swords, label: Nine of Swords }
                - { value: ten-of-swords, label: Ten of Swords }
                - { value: page-of-swords, label: Page of Swords }
                - { value: knight-of-swords, label: Knight of Swords }
                - { value: queen-of-swords, label: Queen of Swords }
                - { value: king-of-swords, label: King of Swords }
                - { value: ace-of-pentacles, label: Ace of Pentacles }
                - { value: two-of-pentacles, label: Two of Pentacles }
                - { value: three-of-pentacles, label: Three of Pentacles }
                - { value: four-of-pentacles, label: Four of Pentacles }
                - { value: five-of-pentacles, label: Five of Pentacles }
                - { value: six-of-pentacles, label: Six of Pentacles }
                - { value: seven-of-pentacles, label: Seven of Pentacles }
                - { value: eight-of-pentacles, label: Eight of Pentacles }
                - { value: nine-of-pentacles, label: Nine of Pentacles }
                - { value: ten-of-pentacles, label: Ten of Pentacles }
                - { value: page-of-pentacles, label: Page of Pentacles }
                - { value: knight-of-pentacles, label: Knight of Pentacles }
                - { value: queen-of-pentacles, label: Queen of Pentacles }
                - { value: king-of-pentacles, label: King of Pentacles }
          - name: orientation
            label: Orientation
            type: select
            required: true
            default: upright
            options:
              values:
                - { value: upright, label: Upright }
                - { value: reversed, label: Reversed }
          - { name: question, label: Question or Prompt, type: string, required: false }
          - { name: position, label: Spread Position, type: string, required: false }
          - { name: interpretation, label: My Interpretation, type: rich-text, required: false }
          - { name: symbols, label: Symbols Noticed, type: rich-text, required: false }
          - { name: outcome, label: Outcome or Follow-up, type: rich-text, required: false }
          - { name: notes, label: Notes, type: rich-text, required: false }
          - { name: body, label: Additional Entry, type: rich-text, required: false }

      - name: moon
        label: Moon Journal
        type: collection
        path: grimoire/moon/entries
        filename: "{year}-{month}-{day}-{primary}.md"
        format: yaml-frontmatter
        view:
          primary: title
          fields: [phase, date, moon_sign]
          sort: date
          order: desc
        fields:
          - { name: title, label: Entry Title, type: string, required: true }
          - { name: date, label: Date, type: date, required: true }
          - name: phase
            label: Moon Phase
            type: select
            required: true
            options:
              values:
                - { value: new-moon, label: New Moon }
                - { value: waxing-crescent, label: Waxing Crescent }
                - { value: first-quarter, label: First Quarter }
                - { value: waxing-gibbous, label: Waxing Gibbous }
                - { value: full-moon, label: Full Moon }
                - { value: waning-gibbous, label: Waning Gibbous }
                - { value: last-quarter, label: Last Quarter }
                - { value: waning-crescent, label: Waning Crescent }
          - { name: moon_sign, label: Moon Sign, type: string, required: false }
          - { name: moon_name, label: Moon Name, type: string, required: false }
          - { name: weather, label: Weather / Sky, type: string, required: false }
          - { name: mood, label: Mood / Energy, type: rich-text, required: false }
          - { name: intentions, label: Intentions, type: rich-text, required: false }
          - { name: release, label: What I Am Releasing, type: rich-text, required: false }
          - { name: ritual, label: Ritual / Practice, type: rich-text, required: false }
          - { name: tarot, label: Tarot Cards Pulled, type: rich-text, required: false }
          - { name: dreams, label: Dreams, type: rich-text, required: false }
          - { name: observations, label: Observations, type: rich-text, required: false }
          - { name: notes, label: Notes, type: rich-text, required: false }

      - name: crystals
        label: Crystals
        type: collection
        path: grimoire/crystals/entries
        filename: "{primary}.md"
        format: yaml-frontmatter
        view:
          primary: title
          fields: [variety, element]
          sort: title
          order: asc
        fields:
          - { name: title, label: Crystal Name, type: string, required: true }
          - { name: variety, label: Variety, type: string, required: false }
          - { name: image, label: Photo, type: image, required: false }
          - { name: color, label: Color, type: string, required: false }
          - { name: element, label: Element, type: string, required: false }
          - { name: chakra, label: Chakra, type: string, required: false }
          - { name: zodiac, label: Zodiac, type: string, required: false }
          - { name: geology, label: Physical / Geological Notes, type: rich-text, required: false }
          - { name: associations, label: Traditional Associations, type: rich-text, required: false }
          - { name: uses, label: Uses, type: rich-text, required: false }
          - { name: care, label: Cleansing & Care, type: rich-text, required: false }
          - { name: pairings, label: Crystal Pairings, type: string, required: false }
          - { name: acquired, label: Where / When Acquired, type: string, required: false }
          - { name: personal_notes, label: My Stone, type: rich-text, required: false }
          - { name: notes, label: Additional Notes, type: rich-text, required: false }

      - name: signs_symbols
        label: Signs & Symbols
        type: collection
        path: grimoire/signs-symbols/entries
        filename: "{primary}.md"
        format: yaml-frontmatter
        view:
          primary: title
          fields: [title, category]
          sort: title
          order: asc
        fields:
          - { name: title, label: Title, type: string, required: true }
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - { value: numerology, label: Numerology }
                - { value: repeating-numbers, label: Repeating Numbers }
                - { value: omens-signs, label: Omens & Signs }
                - { value: animal-guides, label: Animal Guides }
                - { value: symbols, label: Symbols }
                - { value: colors-associations, label: Colors & Associations }
                - { value: elements-directions, label: Elements & Directions }
                - { value: plants-nature, label: Plants & Nature }
                - { value: folklore, label: Folklore }
                - { value: personal-observations, label: Personal Observations }
          - { name: image, label: Image, type: image, required: false }
          - { name: meaning, label: Meaning, type: rich-text, required: false }
          - { name: interpretations, label: Common Interpretations, type: rich-text, required: false }
          - { name: personal_notes, label: Personal Notes, type: rich-text, required: false }
          - { name: related_symbols, label: Related Symbols, type: string, required: false }
          - { name: body, label: Additional Notes, type: rich-text, required: false }

  - name: plants
    label: Plants
    type: collection
    path: garden/plants
    subfolders: true
    filename: "{primary}.html"
    format: yaml-frontmatter
    view:
      primary: title
      fields: [plant_group, title, show_harvest, show_apothecary]
      sort: title
      order: asc
    fields:
      - { name: title, label: Plant Name, type: string, required: true }
      - { name: scientific_name, label: Scientific Name, type: string, required: false }
      - { name: photo, label: Photo, type: image, required: false }
      - name: plant_group
        label: Plant Group
        type: select
        required: true
        options:
          values:
            - { value: trees-shrubs, label: Trees & Shrubs }
            - { value: flowers, label: Perennials & Flowers }
            - { value: climbers, label: Vines & Climbers }
            - { value: edibles, label: Fruit & Edibles }
            - { value: weeds, label: Weeds }
      - { name: plant_type, label: Type, type: string, required: true }
      - { name: bloom, label: Bloom / Seasonal Interest, type: string, required: true }
      - { name: light, label: Light, type: string, required: true }
      - { name: water, label: Water, type: string, required: true }
      - { name: garden_notes, label: Garden Notes, type: rich-text, required: false }
      - { name: seasonal_record, label: Seasonal Record, type: rich-text, required: false }

      - { name: show_harvest, label: Show in Harvest & Use, type: boolean, default: false }
      - { name: harvest_season, label: Harvest Season, type: string, required: false }
      - { name: parts_used, label: Parts to Gather / Use, type: string, required: false }
      - { name: harvest, label: Harvesting Notes, type: rich-text, required: false }
      - { name: harvest_uses, label: Harvest Uses, type: rich-text, required: false }
      - { name: preserve_dry, label: Drying Notes, type: rich-text, required: false }
      - { name: preserve_freeze, label: Freezing Notes, type: rich-text, required: false }
      - { name: preserve_infuse, label: Infusing / Other Use Notes, type: rich-text, required: false }
      - { name: preparation, label: Preparation & Preservation, type: rich-text, required: false }

      - { name: show_apothecary, label: Show in Apothecary, type: boolean, default: false }
      - { name: common_name, label: Common Name, type: string, required: false }
      - { name: habitat, label: Habitat & Growing Conditions, type: rich-text, required: false }
      - { name: identification, label: Identification Notes, type: rich-text, required: false }
      - { name: benefits, label: Benefits, type: rich-text, required: false }
      - { name: medicinal_uses, label: Traditional Medicinal Uses, type: rich-text, required: false }
      - { name: culinary_uses, label: Culinary Uses, type: rich-text, required: false }
      - { name: magical_uses, label: Folklore & Magical Associations, type: rich-text, required: false }
      - { name: cautions, label: Safety & Cautions, type: rich-text, required: false }
      - { name: personal_notes, label: Apothecary Notes, type: rich-text, required: false }
      - { name: sources, label: Sources & References, type: rich-text, required: false }
      - { name: body, label: Additional Notes, type: rich-text, required: false }
