<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>The Book of Letters | Root & Brass</title><link rel="stylesheet" href="/grimoire/style.css"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{color:#eee5d6;font:17px Georgia,serif}main{max-width:1000px;margin:auto;padding:30px 18px}a{color:#c6a56a}header{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #695036;padding-bottom:18px}h1{font-weight:normal;font-size:clamp(34px,6vw,58px);margin:35px 0 6px;text-align:center}p.intro{text-align:center;color:#b9a98e;font-style:italic;margin-bottom:35px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,textarea,select,button{font:inherit;padding:12px;background:#211a19;color:#f3e9d9;border:1px solid #73593c}button{cursor:pointer}button:hover{border-color:#d6ad66}input[type=search]{flex:1;min-width:180px}.entries{display:grid;gap:12px}.entry{padding:19px;border:1px solid #5a4632;background:#201918;text-align:left;width:100%}.entry strong{display:block;font-size:22px;font-weight:normal;margin-bottom:6px}.meta{font-size:13px;color:#c4a773}.excerpt{color:#d6c9b7;margin-top:8px;white-space:pre-wrap}.notice{color:#dcbda1}.empty{padding:25px;border:1px dashed #705638;text-align:center;color:#c5b69c}</style></head><body><main class="grimoire-shell"><header class="grimoire-header"><a class="grimoire-mark" href="/grimoire/">Grimoire</a><a class="return-link" href="/crone/letters/">Write in Crone →</a></header><h1>The Book of Letters</h1><p class="intro">For the questions we send into the silence, and the answers we find along the way.</p><div class="toolbar"><input type="search" id="search" placeholder="Search letters, names, questions…"><select id="filter"><option value="all">All letters</option><option value="open">Awaiting reply</option><option value="answered">Answered</option></select></div><div id="notice" role="status"></div><div id="entries" class="entries"></div></main><script>let letters=[];const entries=document.querySelector('#entries');function draw(){entries.replaceChildren();const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;const found=letters.filter(x=>(f==='all'||x.status===f)&&[x.title,x.recipient,x.asked,...(x.observations||[]).map(o=>o.note)].join(' ').toLowerCase().includes(q));if(!found.length){entries.innerHTML='<p class="empty">No letters found. Your next question can begin in Crone.</p>';return}for(const x of found){const b=document.createElement('button');b.className='entry';const title=document.createElement('strong');title.textContent=x.title||'Untitled letter';const meta=document.createElement('div');meta.className='meta';meta.textContent=x.date+' · '+(x.recipient||'Unaddressed')+' · '+(x.status==='answered'?'Answered':'Awaiting reply');const excerpt=document.createElement('div');excerpt.className='excerpt';excerpt.textContent=x.asked.slice(0,240);b.append(title,meta,excerpt);b.onclick=()=>location.href='/crone/letters/?id='+encodeURIComponent(x.id);entries.append(b)}}document.querySelector('#search').oninput=draw;document.querySelector('#filter').onchange=draw;fetch('/api/crone/letters').then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);letters=d.items;draw()}).catch(e=>document.querySelector('#notice').textContent=e.message);</script></body></html>
