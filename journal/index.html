<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Journal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="journal-site">

  <main class="journal-paper">

    <section class="journal-index">

      <h1>Journal</h1>

      <div class="journal-years">

  {% assign journal_entries = site.pages
    | where_exp: "item", "item.path contains 'journal/entries/'"
    | sort: "date"
    | reverse
  %}

  <ul class="journal-entry-list">
    {% for entry in journal_entries %}

      <li>
        <a href="{{ entry.url }}">
          {{ entry.date | date: "%B %-d, %Y" }}
        </a>
      </li>

    {% endfor %}
  </ul>

</div>

    </section>

  </main>

</body>
</html>
