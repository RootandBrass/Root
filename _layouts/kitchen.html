<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Root &amp; Brass</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/kitchen/style.css?v=20260817b">
  <link rel="stylesheet" href="/section-themes.css?v=20260822a">
</head>

<body class="secondary-page kitchen-site kitchen-entry-site">
  <header class="site-header">
    <a href="/" aria-label="Root &amp; Brass home">
      <img src="/images/logo.png" alt="Root &amp; Brass" class="site-logo">
    </a>
  </header>

  <nav class="main-nav" aria-label="Main navigation">
    <a href="/">Home</a>
    <a href="/house.html">301 Ruby</a>
    <a href="/garden.html">The Garden</a>
    <a href="/kitchen/" aria-current="page">The Kitchen</a>
    <a href="/about.html">About</a>
  </nav>

  <main class="kitchen-recipe">
    <article class="kitchen-recipe-paper">
      <header class="kitchen-recipe-header">
        <p class="kitchen-recipe-origin">From the kitchen at 301 Ruby</p>
        <p class="kitchen-recipe-category">{{ page.category | replace: "-", " " }}</p>
        <h1>{{ page.title }}</h1>
        <span class="kitchen-recipe-rule" aria-hidden="true"></span>
      </header>

      {% if page.photo %}
        <figure class="kitchen-recipe-photo">
          <img src="{{ page.photo | relative_url }}" alt="{{ page.title }}">
        </figure>
      {% endif %}

      <div class="kitchen-recipe-content">
        {{ content }}
      </div>

      <footer class="kitchen-recipe-back">
        <a href="{{ '/kitchen/' | relative_url }}">← Return to the recipe index</a>
      </footer>
    </article>
  </main>

  <footer><p>&copy; 2026 Root & Brass</p></footer>
</body>
</html>
