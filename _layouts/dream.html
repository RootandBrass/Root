<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="noindex, nofollow">

    <title>{{ page.title }} | Dreams | Grimoire</title>

    <link rel="icon"
          type="image/png"
          href="/grimoire/images/icon.png">

    <link rel="stylesheet"
          href="/grimoire/style.css">
</head>

<body class="dreams dream-article-page">

<div class="grimoire-shell">

    <header class="grimoire-header">

        <a href="/grimoire/"
           class="grimoire-mark">
            Grimoire
        </a>

        <a href="/grimoire/dreams/"
           class="return-link">
            Back to Dreams
        </a>

    </header>


    <main class="dream-article">

        <article>

            <header class="dream-article-header">

                <p class="kicker">
                    Dream Journal
                </p>

                <p class="dream-article-date">
                    {{ page.date | date: "%B %-d, %Y" }}
                </p>

                <h1>
                    {{ page.title }}
                </h1>

                <div class="dream-article-symbol">
                    ☾ ✧ ☽
                </div>

            </header>


            {% if page.image %}

                <div class="dream-article-image">

                    <img
                        src="{{ page.image }}"
                        alt="{{ page.title }}">

                </div>

            {% endif %}


            <div class="dream-article-content">

                {{ content }}

            </div>


            {% if page.notes %}

                <section class="dream-notes">

                    <h2>
                        Notes
                    </h2>

                    {{ page.notes | markdownify }}

                </section>

            {% endif %}


            <footer class="dream-article-footer">

                <a href="/grimoire/dreams/">
                    ← Return to Dreams
                </a>

            </footer>

        </article>

    </main>

</div>

</body>

</html>
