name: Migrate Apothecary into Plants

# One-time migration. This follow-up commit intentionally triggers the workflow now that it exists on main.
on:
  push:
    paths:
      - '.github/workflows/migrate-apothecary-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Apothecary records into Plants
        run: |
          ruby <<'RUBY'
          require 'yaml'
          require 'fileutils'
          require 'date'

          def read_front_matter(path)
            text = File.read(path)
            match = text.match(/\A---\s*\n(.*?)\n---\s*\n?/m)
            raise "No front matter in #{path}" unless match
            YAML.safe_load(match[1], permitted_classes: [Date, Time], aliases: true) || {}
          end

          def write_front_matter(path, data)
            FileUtils.mkdir_p(File.dirname(path))
            yaml = data.to_yaml.sub(/\A---\s*\n/, '')
            File.write(path, "---\n#{yaml}---\n")
          end

          plant_files = Dir['garden/plants/**/*.html']
          by_scientific = {}
          plant_files.each do |path|
            data = read_front_matter(path)
            sci = data['scientific_name'].to_s.strip
            by_scientific[sci.downcase] = path unless sci.empty?
          end

          missing_defaults = {
            'matricaria discoidea' => {
              'path' => 'garden/plants/flowers/pineappleweed.html',
              'plant_group' => 'flowers',
              'plant_type' => 'Annual herb',
              'bloom' => 'Late spring through summer',
              'light' => 'Full sun',
              'water' => 'Low to moderate'
            },
            'portulaca oleracea' => {
              'path' => 'garden/plants/edibles/purslane.html',
              'plant_group' => 'edibles',
              'plant_type' => 'Annual succulent',
              'bloom' => 'Summer',
              'light' => 'Full sun',
              'water' => 'Low'
            }
          }

          apothecary_fields = %w[
            common_name habitat identification benefits medicinal_uses culinary_uses
            magical_uses parts_used harvest preparation cautions personal_notes sources
          ]

          migrated = []
          Dir['grimoire/apothecary/entries/*.md'].sort.each do |legacy_path|
            legacy = read_front_matter(legacy_path)
            sci = legacy['scientific_name'].to_s.strip
            key = sci.downcase
            master_path = by_scientific[key]

            unless master_path
              defaults = missing_defaults[key]
              raise "No matching Plant record for #{legacy_path} (#{sci})" unless defaults
              master_path = defaults['path']
              master = {
                'title' => legacy['title'],
                'scientific_name' => sci,
                'plant_group' => defaults['plant_group'],
                'plant_type' => defaults['plant_type'],
                'bloom' => defaults['bloom'],
                'light' => defaults['light'],
                'water' => defaults['water']
              }
            else
              master = read_front_matter(master_path)
            end

            master['show_apothecary'] = true
            master['photo'] = legacy['image'] if master['photo'].to_s.strip.empty? && !legacy['image'].to_s.strip.empty?

            apothecary_fields.each do |field|
              next if legacy[field].nil? || legacy[field].to_s.strip.empty?
              if master[field].nil? || master[field].to_s.strip.empty?
                master[field] = legacy[field]
              elsif master[field].to_s.strip != legacy[field].to_s.strip && %w[harvest preparation].include?(field)
                master[field] = [master[field].to_s.strip, legacy[field].to_s.strip].join("\n\n")
              end
            end

            master.delete('found_date')
            master.delete('found_location')

            write_front_matter(master_path, master)
            File.delete(legacy_path)
            by_scientific[key] = master_path
            migrated << "#{legacy['title']} -> #{master_path}"
          end

          puts "Migrated #{migrated.length} Apothecary records:"
          puts migrated
          RUBY

      - name: Remove one-time workflow and commit migration
        run: |
          rm .github/workflows/migrate-apothecary-once.yml
          git config user.name 'Root & Brass Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes found.'
            exit 0
          fi
          git commit -m 'Merge Apothecary records into unified Plants'
          git push origin main
