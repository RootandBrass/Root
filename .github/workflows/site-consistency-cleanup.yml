name: One-time Site Consistency Cleanup

on:
  push:
    paths:
      - '.github/workflows/site-consistency-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply consistency cleanup
        shell: python
        run: |
          from pathlib import Path

          # Fix the broken Marigold link without changing the page design/content.
          harvest = Path('garden/harvest.html')
          text = harvest.read_text()
          text = text.replace('/garden/plants/flowers/merigold.html', '/garden/plants/flowers/marigold.html')
          text = text.replace('../garden/plants/flowers/merigold.html', '/garden/plants/flowers/marigold.html')
          harvest.write_text(text)

          # Remove obsolete GitHub Pages / retired-page leftovers.
          for old in ['CNAME', 'note.html']:
              p = Path(old)
              if p.exists():
                  p.unlink()

          # Remove only verified unreferenced duplicate/test images.
          for old in [
              'images/Test.png',
              'images/uploads/randblogov1.png',
              'images/uploads/img1770-1.jpeg',
              'images/uploads/img1774-1.jpeg',
              'grimoire/images/test.png',
          ]:
              p = Path(old)
              if p.exists():
                  p.unlink()

          # Replace the six-byte README with a useful maintenance map.
          Path('README.md').write_text('''# Root & Brass\n\nRoot & Brass is a personal Jekyll site for the house at 301 Ruby, the garden, kitchen, journal, and private grimoire.\n\n## How the site works\n\n- **GitHub** is the source of truth for site files and content.\n- **Jekyll** builds the repository into `_site`.\n- **Azure Static Web Apps** serves the built site and handles authentication for private areas.\n- **Pages CMS** provides structured desktop editing through `.pages.yml`.\n- **Crone** (`/crone/`) is the private mobile content editor. Its Azure Functions API writes structured entries and uploaded images back to GitHub.\n\n## Public areas\n\nThe main site, 301 Ruby, Garden, Kitchen, History, and About pages are public.\n\n## Protected areas\n\nAzure Static Web Apps requires the `crone` role for:\n\n- `/crone` and `/crone/*`\n- `/journal` and `/journal/*`\n- `/grimoire` and `/grimoire/*`\n- `/api/crone/*`\n\nAuthentication and redirects are configured in `staticwebapp.config.json`.\n\n## Content structure\n\n### Garden\n- Plant records: `garden/plants/`\n- Seasonal records: `garden/seasonal/entries/`\n- Garden projects: `garden/projects/entries/`\n- Harvest & Use records: `garden/harvest/entries/`\n\n### Kitchen\n- Recipes: `kitchen/entries/`\n\n### Journal\n- Entries: `journal/entries/`\n\n### Grimoire\nStructured entries live under each section's `entries/` folder, including Apothecary, Crystals, Dreams, Moon, Recipes, Signs & Symbols, Spells, and Tarot.\n\n## Layouts and CMS\n\nJekyll defaults in `_config.yml` assign layouts to structured entry folders. Pages CMS collections and fields are defined in `.pages.yml`. When adding a new structured content type, keep these four pieces aligned:\n\n1. repository entry folder\n2. `.pages.yml` collection\n3. Jekyll rendering/defaults where needed\n4. Crone/API content-type definition if mobile editing is desired\n\n## Deployment\n\nThe GitHub Actions workflow `.github/workflows/azure-static-web-apps-blue-sea-0b6847910.yml` builds Jekyll and deploys `_site` to Azure Static Web Apps.\n\n## Maintenance rule\n\nFor ordinary content additions, prefer Pages CMS or Crone instead of hand-editing generated/structured entry markup. Keep secrets such as the Crone GitHub token in Azure environment variables, never in repository files.\n''')

          # Remove this one-time workflow after it has done its job.
          Path('.github/workflows/site-consistency-cleanup.yml').unlink(missing_ok=True)

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git config user.name "Root & Brass Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clean Root & Brass consistency issues"
          git push
